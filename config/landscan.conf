# LandScan runtime configuration

# LiDAR connection
lidar_port=/dev/ttyACM0
lidar_baudrate=921600

# SF45/B measurement settings
lidar_update_rate_hz=500
lidar_scan_low_angle_deg=-45
lidar_scan_high_angle_deg=45

# LiDAR mounting offset in DJI body FRD coordinates
# forward: +X
# right:   +Y
# down:    +Z
lidar_offset_forward_m=0.0
lidar_offset_right_m=0.0
lidar_offset_down_m=0.0

# Coordinate reference systems
source_geographic_epsg_code=4326
output_projected_epsg_code=5186
